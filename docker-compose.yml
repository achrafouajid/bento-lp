services:
  landing:
    # `image` lets CI deploy by `docker compose pull` (LP_IMAGE_TAG set to the
    # commit-sha tag GHCR just built); `build` keeps `docker compose up -d --build`
    # working unchanged for local/manual use.
    image: ghcr.io/achrafouajid/bento-lp:${LP_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile

    container_name: bento-lp

    restart: unless-stopped

    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_TELEMETRY_DISABLED: "1"

    networks:
      - proxy

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bento-lp.rule=Host(`lp.bento212.com`)"
      - "traefik.http.routers.bento-lp.entrypoints=websecure"
      - "traefik.http.routers.bento-lp.tls=true"
      - "traefik.http.routers.bento-lp.tls.certresolver=letsencrypt"
      - "traefik.http.services.bento-lp.loadbalancer.server.port=3000"
      - "traefik.docker.network=proxy"

networks:
  proxy:
    external: true
